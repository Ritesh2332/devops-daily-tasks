name: docker-build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: Unit-5-GitHub-Actions/task7_docker-image-build
          push: false
          load: true
          tags: gha-docker-lab:ci
      - run: docker run --rm gha-docker-lab:ci
