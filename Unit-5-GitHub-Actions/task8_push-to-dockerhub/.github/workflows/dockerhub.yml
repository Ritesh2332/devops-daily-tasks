name: dockerhub-push

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: Unit-5-GitHub-Actions/task8_push-to-dockerhub
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gha-lab:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gha-lab:${{ github.sha }}
