name: ghcr-push

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: Unit-5-GitHub-Actions/task9_push-to-ghcr
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gha-lab:latest
            ghcr.io/${{ github.repository_owner }}/gha-lab:${{ github.sha }}
