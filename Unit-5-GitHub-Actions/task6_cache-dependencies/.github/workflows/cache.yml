name: cache-deps

on:
  workflow_dispatch:
  push:
    branches: [main]

defaults:
  run:
    working-directory: Unit-5-GitHub-Actions/task5_java-maven-build

jobs:
  cached-maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('Unit-5-GitHub-Actions/task5_java-maven-build/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - run: mvn -B dependency:go-offline test
